name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("Cargo.toml").open("rb") as source:
              version = tomllib.load(source)["workspace"]["package"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} must equal v{version}")
          prerelease = "-" in version.split("+", 1)[0]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={version}\n")
              output.write(f"prerelease={str(prerelease).lower()}\n")
          PY

  checks:
    needs: version
    uses: ./.github/workflows/check.yml

  publish:
    name: Publish verified release assets
    needs: [version, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rooklet-macos-*
          merge-multiple: true
          path: dist
      - name: Verify both archive/checksum pairs
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          directory = Path("dist")
          expected = {
              f"rooklet-{version}-macos-{arch}.tar.gz{suffix}"
              for arch in ("arm64", "x86_64")
              for suffix in ("", ".sha256")
          }
          if {path.name for path in directory.iterdir()} != expected:
              raise SystemExit("Expected exactly the ARM and Intel archives and checksums")
          for arch in ("arm64", "x86_64"):
              archive = directory / f"rooklet-{version}-macos-{arch}.tar.gz"
              checksum = archive.with_name(f"{archive.name}.sha256")
              if (archive.is_symlink() or checksum.is_symlink()
                      or not archive.is_file() or not checksum.is_file()):
                  raise SystemExit("Release assets must be regular files")
              with archive.open("rb") as source:
                  digest = hashlib.file_digest(source, "sha256").hexdigest()
              if checksum.read_text() != f"{digest}  {archive.name}\n":
                  raise SystemExit(f"Invalid checksum for {archive.name}")
          PY
      - name: Upload draft assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [ "$existing" != true ]; then
              echo 'This release is already published; its assets will not be replaced.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
              --title "Rooklet $RELEASE_TAG" --prerelease="$RELEASE_PRERELEASE"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
